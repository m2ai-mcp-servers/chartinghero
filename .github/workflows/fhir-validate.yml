name: fhir-validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  base-and-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # @medplum/core (dev only) needs Node ^22.18 or >=24.2.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # BASE
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p tests/tsconfig.json
      - run: npx eslint "src/**/*.ts"
      - run: npm run build
      - run: npx jest

      - name: Golden fixtures are current
        run: |
          npm run golden
          git add -N tests/fixtures
          git diff --exit-code -- tests/fixtures

      - name: Cache validator jar and FHIR packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/chartinghero
            ~/.fhir/packages
          key: fhir-validator-7.0.5-us-core-9.0.0

      # Jar pinned by sha256 inside the script.
      - run: bash scripts/validate-golden.sh

  # The backend contract against a real FHIR server (plan Q12). Same image and settings as
  # docker/compose.fhir.yml; the data is the fictional seed.
  fhir-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      hapi:
        image: hapiproject/hapi:v8.12.0-2
        ports:
          - 8080:8080
        env:
          SPRING_DATASOURCE_URL: 'jdbc:h2:mem:test_mem'
          HAPI_FHIR_FHIR_VERSION: 'R4'
          JAVA_TOOL_OPTIONS: '-Xmx1g'
    env:
      FHIR_IT_BASE_URL: http://localhost:8080/fhir
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The image has no shell, so there is no container health check: wait here.
      - name: Wait for the FHIR server
        run: |
          curl -sf --retry 60 --retry-delay 5 --retry-all-errors -o /dev/null "$FHIR_IT_BASE_URL/metadata"
          test "$(curl -sf "$FHIR_IT_BASE_URL/metadata" | jq -r .fhirVersion)" = "4.0.1"

      - run: node scripts/seed-fhir.mjs

      - run: npx jest tests/contract

      # The data is in memory on purpose: a restart must leave nothing behind.
      - name: Restart wipes the data
        run: |
          docker restart "${{ job.services.hapi.id }}"
          curl -sf --retry 60 --retry-delay 5 --retry-all-errors -o /dev/null "$FHIR_IT_BASE_URL/metadata"
          test "$(curl -sf "$FHIR_IT_BASE_URL/Patient?_count=1" | jq '(.entry // []) | length')" = "0"
